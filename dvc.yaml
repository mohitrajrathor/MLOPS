stages:
  prepare:
    cmd: python3 src/prepare.py
    deps:
      - src/prepare.py
      - data/iris.csv
    params:
      - prepare.augment_factor
      - prepare.noise_std
      - prepare.random_state
    outs:
      - data/iris_prepared.csv

  train:
    cmd: python3 src/train.py
    deps:
      - src/train.py
      - data/iris_prepared.csv
    params:
      - train.n_estimators
      - train.max_depth
      - train.test_size
      - train.random_state
    outs:
      - models/model.pkl
    metrics:
      - metrics.json:
          cache: false
